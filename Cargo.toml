[package]
name = "arioch"
version = "0.1.0"
edition = "2021"
description = "Security file manager — view, manage, and map local security files"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
glob = "0.3"
shellexpand = "3"
textwrap = "0.16"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
